<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Chatbot - Trợ lý học tập thông minh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>📚 Gia Sư AI Thông Minh</h2>
            <p>Hỏi đáp bài tập, giải thích khái niệm & luyện tập</p>
        </header>
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Xin chào! Mình là trợ lý AI học tập của bạn. Hôm nay bạn muốn học môn gì hoặc cần giải đáp thắc mắc nào?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn tại đây..." autofocus>
            <button id="sendBtn">Gửi</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
